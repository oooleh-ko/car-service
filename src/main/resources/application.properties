spring.h2.console.enabled=true
spring.datasource.generate-unique-name=false
# perf-test branch: file-based DB, so the generated load-test data survives restarts
# and every k6 run works with the same dataset.
# Tables are created by CarServiceApplication.createTables(), not by schema.sql.
spring.datasource.url=jdbc:h2:file:./database/carService
# in-memory DB used in lab-11-jdbc-angular (recreated from schema.sql and data.sql on every start)
#spring.datasource.url=jdbc:h2:mem:carService;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
# never: schema.sql/data.sql are not run, so they don't drop the perf data
spring.sql.init.mode=never
#spring.sql.init.mode=always
server.port=8079
