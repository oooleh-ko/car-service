<div class="container">
  <h2>Rent a Car</h2>
  
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- Car Details Section -->
  <div class="card mb-4" *ngIf="car">
    <div class="row g-0">
      <div class="col-md-4">
        <img [src]="car.imageUrl || defaultImageUrl" 
             [alt]="car.brand + ' ' + car.model"
             class="img-fluid rounded-start"
             (error)="handleImageError($event)">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{car.brand}} {{car.model}}</h5>
          <p class="card-text">
            <strong>Year:</strong> {{car.productionYear}}<br>
            <strong>VIN:</strong> {{car.vinCode}}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Rental Form -->
  <form [formGroup]="rentForm" (ngSubmit)="onSubmit()" class="needs-validation">
    <div class="mb-3">
      <label for="customerId" class="form-label">Customer ID</label>
      <input type="number" class="form-control" id="customerId" formControlName="customerId"
        [class.is-invalid]="rentForm.get('customerId')?.invalid && rentForm.get('customerId')?.touched">
      <div class="invalid-feedback">
        Customer ID is required
      </div>
    </div>

    <div class="mb-3">
      <label for="startDate" class="form-label">Start Date</label>
      <input type="date" class="form-control" id="startDate" formControlName="startDate"
        [class.is-invalid]="rentForm.get('startDate')?.invalid && rentForm.get('startDate')?.touched">
      <div class="invalid-feedback">
        Start date is required
      </div>
    </div>

    <div class="mb-3">
      <label for="endDate" class="form-label">End Date</label>
      <input type="date" class="form-control" id="endDate" formControlName="endDate"
        [class.is-invalid]="rentForm.get('endDate')?.invalid && rentForm.get('endDate')?.touched">
      <div class="invalid-feedback">
        End date is required
      </div>
    </div>

    <div class="mb-3">
      <button type="submit" class="btn btn-primary" [disabled]="!rentForm.valid">Rent Car</button>
      <button type="button" class="btn btn-secondary ms-2" routerLink="/cars">Cancel</button>
    </div>
  </form>
</div>
