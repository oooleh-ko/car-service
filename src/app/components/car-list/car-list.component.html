<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Available Cars</h2>
    <button class="btn btn-primary" routerLink="/cars/new">Add New Car</button>
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let car of cars">
      <div class="card h-100">
        <!-- Image with fallback -->
        <div class="card-img-top car-image-container">
          <img [src]="car.imageUrl || 'assets/default-car.png'" 
               class="card-img-top" 
               [alt]="car.brand + ' ' + car.model"
               (error)="handleImageError($event)">
        </div>
        <div class="card-body">
          <h5 class="card-title">{{car.brand}} {{car.model}}</h5>
          <div class="card-text">
            <p><strong>Year:</strong> {{car.productionYear}}</p>
            <p><strong>VIN:</strong> {{car.vinCode}}</p>
            <p class="text-muted small">ID: {{car.id}}</p>
          </div>
          <div class="btn-group mt-2">
            <button class="btn btn-primary" [routerLink]="['/rent', car.id]">
              Rent This Car
            </button>
            <button class="btn btn-secondary" [routerLink]="['/cars/edit', car.id]">
              Edit
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="cars.length === 0" class="alert alert-info">
    No cars available at the moment.
  </div>
</div>
