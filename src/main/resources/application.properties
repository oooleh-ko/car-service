spring.h2.console.enabled=true
spring.datasource.generate-unique-name=false
# in-memory DB: recreated from schema.sql and data.sql on every start
spring.datasource.url=jdbc:h2:mem:carService;DB_CLOSE_DELAY=-1
# previous file-based DB: kept data between restarts, but the file is git-ignored,
# so on a fresh clone the DB had no tables (nothing created them with init.mode=never)
#spring.datasource.url=jdbc:h2:file:./database/carService
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin
spring.sql.init.mode=always
# previous value: never ran schema.sql/data.sql, so tables had to exist already
#spring.sql.init.mode=never
server.port=8079
