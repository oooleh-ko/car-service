  <div class="container">

      <div class="dropdown me-3">

                type="button"

              {{city}}
            </button>
          </li>
        </ul>
      </div>

      <!-- Navigation Links -->

        <a class="btn btn-outline-primary" routerLink="/signin">Sign In</a>
        <a class="btn btn-primary" routerLink="/signup">Sign Up</a>
      </div>
    </div>
  </div>
</nav>
